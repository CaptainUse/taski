server {

    listen 80;
    server_name 51.250.1.197;

    # Новый блок.
    location /api/ {
        # Эта команда определяет, куда нужно перенаправить запрос.
        proxy_pass http://127.0.0.1:8000;
    }

    # Новый блок.
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location /static_backend/ {
        alias /var/www/taski/static_backend/;
    }

    location / {
        root   /var/www/taski;
        index  index.html index.htm;
        try_files $uri /index.html;
    }

}
